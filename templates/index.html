<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Echo Dashboard — Discord Infrastructure Builder</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #0b0d12;
            --panel-bg: rgba(18, 21, 30, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(22, 26, 35, 0.8);
            --input-border: rgba(255, 255, 255, 0.12);
            
            --text-title: #ffffff;
            --text-sub: #949ba4;
            --text-muted: #5c626d;
            
            --discord-sidebar: #11131a;
            --discord-hover: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(19, 23, 34, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);

            /* Glassmorphism Dynamic State Colors */
            --glass-idle-bg: rgba(255, 255, 255, 0.03);
            --glass-idle-text: #4e535e;
            --glass-idle-border: rgba(255, 255, 255, 0.05);

            --glass-active-bg: rgba(168, 85, 247, 0.25);
            --glass-active-text: #e9d5ff;
            --glass-active-border: rgba(192, 132, 252, 0.5);
            --glass-active-glow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-base);
            color: #ffffff;
            min-height: 100vh;
            padding: 16px 12px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 100%;
            max-width: 600px; /* Constrained to match the clean single-card flow */
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Glassmorphism Card Container */
        .header-card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 24px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header-card h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            font-weight: 700;
            text-align: center;
        }

        .header-card p {
            color: var(--text-sub);
            font-size: 0.88rem;
            text-align: center;
            margin-bottom: 16px;
        }

        /* User Profile Bar */
        .user-badge-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 14px;
        }

        .user-info-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            color: #fff;
        }

        .username-text {
            font-weight: 600;
            font-size: 0.9rem;
            color: #ffffff;
        }

        .logout-link {
            color: #f43f5e;
            font-size: 0.82rem;
            text-decoration: none;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .logout-link:hover {
            opacity: 1;
        }

        /* Custom reCAPTCHA Widget Box */
        .recaptcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 16px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.2s ease;
        }

        .recaptcha-box:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .recaptcha-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid #4e535e;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .custom-checkbox.checked {
            background: #10b981;
            border-color: #10b981;
        }

        .custom-checkbox i {
            color: #ffffff;
            font-size: 0.75rem;
            display: none;
        }

        .custom-checkbox.checked i {
            display: block;
        }

        .recaptcha-label {
            font-size: 0.88rem;
            color: #e2e8f0;
        }

        .recaptcha-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #4e535e;
        }

        .recaptcha-brand i {
            font-size: 1.2rem;
        }

        .recaptcha-brand span {
            font-size: 0.6rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Inputs Stack */
        .inputs-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label-heading {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: rgba(192, 132, 252, 0.6);
        }

        /* Quick Separator Selector Options Grid */
        .separator-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .sep-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .sep-pill .symbol {
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 2px;
        }

        .sep-pill .name {
            font-size: 0.65rem;
        }

        .sep-pill:hover, .sep-pill.active {
            background: rgba(168, 85, 247, 0.25);
            border-color: rgba(192, 132, 252, 0.6);
            color: #ffffff;
        }

        /* Dynamic Glass UI Action Buttons */
        .btn-glass-action {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: not-allowed;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            background: var(--glass-idle-bg);
            color: var(--glass-idle-text);
            border: 1px solid var(--glass-idle-border);
            box-shadow: none;
            margin-top: 14px;
        }

        .btn-glass-action.ready {
            cursor: pointer;
            background: var(--glass-active-bg);
            color: var(--glass-active-text);
            border: 1px solid var(--glass-active-border);
            box-shadow: var(--glass-active-glow);
        }

        .btn-glass-action.ready:hover {
            background: rgba(168, 85, 247, 0.35);
        }

        /* Preview Panel Section */
        .preview-card {
            background: var(--discord-sidebar);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 12px;
        }

        .preview-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .category-block {
            margin-bottom: 12px;
        }

        .category-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 4px 2px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .tree-item:hover, .tree-item.active {
            background: var(--discord-hover);
            color: #ffffff;
        }

        .tree-item.active {
            background: rgba(168, 85, 247, 0.2);
            color: #ffffff;
        }

        .add-btn-inline {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 4px 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-btn-inline:hover {
            color: #ffffff;
        }

        #status-banner {
            display: none;
            padding: 12px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #ffffff;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
        }

        #discord-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- HEADER CONTROL PANEL -->
        <div class="header-card">
            <h1>Discord Infrastructure</h1>
            <p>Fill in parameters to initialize AI schema parsing.</p>

            <!-- User Login Bar -->
            <div class="user-badge-bar">
                <div class="user-info-left">
                    <div class="user-avatar-badge">
                        <i class="fa-brands fa-discord"></i>
                    </div>
                    <span class="username-text" id="display-user">echo_2530</span>
                </div>
                <a class="logout-link">Logout</a>
            </div>

            <!-- Custom reCAPTCHA Widget -->
            <div class="recaptcha-box" id="recaptcha-btn" onclick="toggleCaptcha()">
                <div class="recaptcha-left">
                    <div class="custom-checkbox" id="captcha-check">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <span class="recaptcha-label">I'm not a robot</span>
                </div>
                <div class="recaptcha-brand">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>reCAPTCHA</span>
                </div>
            </div>

            <!-- Inputs Stack -->
            <div class="inputs-stack">
                <div class="form-group">
                    <label class="label-heading">TARGET SERVER ID *</label>
                    <input type="text" id="target-server-id" class="form-control" value="1554280544605438054" oninput="validateInputs()">
                </div>
                <div class="form-group">
                    <label class="label-heading">SERVER INVITE LINK *</label>
                    <input type="text" id="target-server-link" class="form-control" value="https://discord.gg/6mTr8sr7v" oninput="validateInputs()">
                </div>
                <div class="form-group">
                    <label class="label-heading">SUBMITTED BY USER *</label>
                    <input type="text" id="submitted-by-user" class="form-control" value="@echo_2530" oninput="validateInputs()">
                </div>
                <div class="form-group">
                    <label class="label-heading">SERVER NAME</label>
                    <input type="text" id="target-server-name" class="form-control" value="Echo Studio - Create A Professional Rob Server" oninput="updateServerName()">
                </div>

                <!-- Quick Separator Grid -->
                <div class="form-group" style="margin-top: 4px;">
                    <label class="label-heading">QUICK SEPARATOR</label>
                    <div class="separator-grid">
                        <div class="sep-pill active" onclick="setSeparator('│', this)">
                            <span class="symbol">│</span>
                            <span class="name">Solid Bar</span>
                        </div>
                        <div class="sep-pill" onclick="setSeparator('•', this)">
                            <span class="symbol">•</span>
                            <span class="name">Bullet</span>
                        </div>
                        <div class="sep-pill" onclick="setSeparator('—', this)">
                            <span class="symbol">—</span>
                            <span class="name">Dash</span>
                        </div>
                        <div class="sep-pill" onclick="setSeparator('-', this)">
                            <span class="symbol">-</span>
                            <span class="name">Hyphen</span>
                        </div>
                        <div class="sep-pill" onclick="setSeparator('|', this)">
                            <span class="symbol">|</span>
                            <span class="name">Pipe</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Verify & Continue Button -->
            <button id="verify-continue-btn" class="btn-glass-action">
                Verify & Continue <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div id="status-banner"></div>

        <!-- PREVIEW PANEL -->
        <div class="preview-card">
            <div class="preview-header">
                <h2 id="server-title-heading">Echo Studio</h2>
                <span style="font-size: 0.65rem; color: var(--text-muted); font-weight:700;">LIVE PREVIEW</span>
            </div>
            <div id="sidebar-category-container"></div>
            <button class="add-btn-inline" style="margin-top: 10px; font-weight:700;" onclick="addCategory()">
                <i class="fa-solid fa-plus"></i> NEW CATEGORY
            </button>
        </div>

    </div>

    <!-- Canvas for Image Generation -->
    <canvas id="discord-canvas" width="360" height="600"></canvas>

    <script>
        let isCaptchaVerified = false;
        let selectedSeparator = '│';

        let currentLayout = {
            server_name: "Echo Studio - Create A Professional Rob Server",
            categories: [
                {
                    name: "INFORMATION",
                    emoji: "📢",
                    channels: [
                        { name: "welcome", type: "text", emoji: "👋" },
                        { name: "rules", type: "text", emoji: "📜" }
                    ]
                },
                {
                    name: "CHAT ZONES",
                    emoji: "💬",
                    channels: [
                        { name: "general", type: "text", emoji: "💬" },
                        { name: "media", type: "text", emoji: "📷" }
                    ]
                }
            ]
        };

        function toggleCaptcha() {
            isCaptchaVerified = !isCaptchaVerified;
            const box = document.getElementById('captcha-check');
            if (isCaptchaVerified) {
                box.classList.add('checked');
            } else {
                box.classList.remove('checked');
            }
            validateInputs();
        }

        function setSeparator(sep, el) {
            selectedSeparator = sep;
            document.querySelectorAll('.sep-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            renderSidebar();
        }

        function validateInputs() {
            const serverId = document.getElementById('target-server-id').value.trim();
            const serverLink = document.getElementById('target-server-link').value.trim();
            const user = document.getElementById('submitted-by-user').value.trim();

            const isValid = serverId !== '' && serverLink !== '' && user !== '' && isCaptchaVerified;

            const verifyBtn = document.getElementById('verify-continue-btn');

            if (isValid) {
                verifyBtn.classList.add('ready');
            } else {
                verifyBtn.classList.remove('ready');
            }
        }

        function updateServerName() {
            const val = document.getElementById('target-server-name').value;
            currentLayout.server_name = val;
            document.getElementById('server-title-heading').innerText = val.split('-')[0].trim();
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-category-container');
            container.innerHTML = '';

            currentLayout.categories.forEach((cat, cIdx) => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category-block';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'category-title';
                headerDiv.innerHTML = `
                    <span>▾ ${cat.emoji || ''} ${selectedSeparator} ${cat.name}</span>
                    <i class="fa-solid fa-xmark" onclick="deleteCategory(${cIdx})" style="cursor:pointer;"></i>
                `;
                catDiv.appendChild(headerDiv);

                const channelList = document.createElement('div');
                cat.channels.forEach((chan, chIdx) => {
                    const item = document.createElement('div');
                    item.className = 'tree-item';
                    item.innerHTML = `
                        <div># ${chan.emoji || ''} ${selectedSeparator} ${chan.name}</div>
                        <i class="fa-solid fa-xmark" onclick="deleteChannel(${cIdx}, ${chIdx})" style="color:var(--text-muted);"></i>
                    `;
                    channelList.appendChild(item);
                });

                const addChanBtn = document.createElement('button');
                addChanBtn.className = 'add-btn-inline';
                addChanBtn.innerHTML = `<i class="fa-solid fa-plus"></i> new-channel`;
                addChanBtn.onclick = () => addChannel(cIdx);

                catDiv.appendChild(channelList);
                catDiv.appendChild(addChanBtn);
                container.appendChild(catDiv);
            });
        }

        function addCategory() {
            currentLayout.categories.push({ name: "NEW CATEGORY", emoji: "📁", channels: [] });
            renderSidebar();
        }

        function addChannel(cIdx) {
            currentLayout.categories[cIdx].channels.push({ name: "new-channel", type: "text", emoji: "💬" });
            renderSidebar();
        }

        function deleteCategory(cIdx) {
            currentLayout.categories.splice(cIdx, 1);
            renderSidebar();
        }

        function deleteChannel(cIdx, chIdx) {
            currentLayout.categories[cIdx].channels.splice(chIdx, 1);
            renderSidebar();
        }

        updateServerName();
        renderSidebar();
        validateInputs();
    </script>
</body>
</html>
