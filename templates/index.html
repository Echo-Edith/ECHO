<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORCA AI -- Custom Discord Server Architect Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        orca: {
                            50: '#ecfeff',
                            100: '#cffefb',
                            200: '#a5f3fc',
                            300: '#67e8f9',
                            400: '#22d3ee',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            800: '#155e75',
                            900: '#164e63',
                            950: '#083344',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gray-950 text-gray-100 antialiased selection:bg-cyan-500 selection:text-white">

    <!-- Top Header Navigation -->
    <header class="w-full border-b border-gray-800/80 bg-gray-900/60 backdrop-blur-xl sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-600 to-emerald-500 flex items-center justify-center shadow-lg shadow-cyan-500/20 ring-1 ring-white/20">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent">ORCA AI</h1>
                    <p class="text-xs text-gray-400 font-medium">Server Studio & Infrastructure Engine</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="resetStudio()" class="px-3.5 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold border border-gray-700 transition duration-150">
                    Clear Studio
                </button>
                <button onclick="exportBlueprintJSON()" class="px-4 py-2 rounded-lg bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 text-white text-xs font-semibold shadow-lg shadow-cyan-500/25 transition duration-150 flex items-center space-x-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                    </svg>
                    <span>Export JSON</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Controls & AI Design Generator (5 Columns) -->
        <section class="lg:col-span-5 flex flex-col space-y-6">

            <!-- Prompt & Description Generator Block -->
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 shadow-xl backdrop-blur-md relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-emerald-500"></div>

                <div class="flex items-center justify-between mb-3">
                    <label for="prompt-input" class="text-sm font-semibold text-gray-200 flex items-center space-x-2">
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        <span>Describe Your Server Concept</span>
                    </label>
                    <span class="text-[10px] font-mono uppercase bg-cyan-950 text-cyan-400 px-2 py-0.5 rounded border border-cyan-800/50">Gemini Powered</span>
                </div>

                <!-- Chat Box Text Area Input -->
                <div class="relative mb-4">
                    <textarea id="prompt-input" rows="5" 
                        class="w-full p-3.5 rounded-xl bg-gray-950/80 text-gray-100 placeholder-gray-500 border border-gray-800 focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 outline-none text-sm transition resize-none" 
                        placeholder="e.g., A futuristic cyberpunk esports hub with tactical callout channels, team lobbies, streaming rooms, and automated VIP rank progression..."></textarea>
                </div>

                <!-- Theme Selector Modal Dropdown Directly BELOW the Description Chat Box -->
                <div class="mb-5 bg-gray-950/90 p-3.5 rounded-xl border border-gray-800/80 space-y-2">
                    <div class="flex items-center justify-between">
                        <label for="theme-select" class="text-xs font-semibold text-gray-300">Preset Theme Visuals & Icon Overrides</label>
                        <span class="text-[10px] text-gray-500">Optional Modifier</span>
                    </div>
                    <select id="theme-select" class="w-full p-2.5 rounded-lg bg-gray-900 text-gray-200 text-xs border border-gray-700 focus:border-cyan-500 outline-none transition cursor-pointer">
                        <option value="custom" selected>Dynamic AI Generative Mode (Fully Custom)</option>
                        <option value="gaming">Gaming & Competitive Esports Community</option>
                        <option value="anime">Anime, Lofi & Music Hangout Lounge</option>
                        <option value="cyberpunk">Cyberpunk, Software Dev & Hacker Matrix</option>
                        <option value="chill">Chill Social Study & Creative Art Hub</option>
                    </select>
                </div>

                <!-- Attach Photo Button & Main AI Generate Action -->
                <div class="flex items-center space-x-3">
                    <button type="button" onclick="openPhotoPickerActionSheet()" class="flex-1 py-2.5 px-3 rounded-xl bg-gray-800 hover:bg-gray-700/80 text-gray-300 border border-gray-700 text-xs font-medium transition duration-150 flex items-center justify-center space-x-2">
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                        <span>Attach Image</span>
                    </button>

                    <button type="button" id="btn-generate" onclick="generateLayoutFromAI()" class="flex-[1.5] py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-600 via-teal-600 to-emerald-600 hover:from-cyan-500 hover:to-emerald-500 text-white text-xs font-bold shadow-lg shadow-cyan-600/20 transition duration-150 flex items-center justify-center space-x-2">
                        <svg id="generate-spinner" class="w-4 h-4 hidden animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span id="generate-btn-text">Build Custom Architecture</span>
                    </button>
                </div>
            </div>

            <!-- Global Guild Settings Panel -->
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 shadow-xl space-y-4">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">Guild Infrastructure Settings</h2>

                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Server Title</label>
                    <input type="text" id="guild-name-input" value="Custom Community Realm" class="w-full p-2.5 rounded-lg bg-gray-950 text-gray-100 border border-gray-800 text-xs focus:border-cyan-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Channel Separator</label>
                        <input type="text" id="separator-input" value="│" class="w-full p-2.5 rounded-lg bg-gray-950 text-gray-100 border border-gray-800 text-xs focus:border-cyan-500 outline-none text-center">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-300 mb-1">Server Icon URL</label>
                        <input type="text" id="guild-icon-input" placeholder="https://..." class="w-full p-2.5 rounded-lg bg-gray-950 text-gray-100 border border-gray-800 text-xs focus:border-cyan-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Role Management Sandbox -->
            <div class="bg-gray-900/80 border border-gray-800 rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400">Server Roles Hierarchy</h2>
                    <button onclick="addRolePrompt()" class="px-2.5 py-1 rounded bg-cyan-950 hover:bg-cyan-900 text-cyan-400 border border-cyan-800/60 text-[11px] font-semibold transition">
                        + Add Role
                    </button>
                </div>

                <div id="roles-list-container" class="space-y-2 overflow-y-auto max-h-64 pr-1">
                    <!-- Dynamic Roles Injected Here -->
                </div>
            </div>

        </section>

        <!-- Right Discord Layout Visual Preview Studio (7 Columns) -->
        <section class="lg:col-span-7 flex flex-col space-y-4">

            <div class="bg-gray-900/90 border border-gray-800 rounded-2xl flex-1 flex flex-col shadow-2xl overflow-hidden min-h-[600px]">
                
                <!-- Mock Discord Guild Banner -->
                <div class="h-20 bg-gradient-to-r from-slate-900 via-cyan-950 to-gray-900 border-b border-gray-800 p-4 flex items-center justify-between relative">
                    <div class="flex items-center space-x-3 z-10">
                        <div id="preview-icon-box" class="w-12 h-12 rounded-2xl bg-cyan-600 border-2 border-gray-800 flex items-center justify-center font-bold text-white shadow-lg text-lg overflow-hidden">
                            C
                        </div>
                        <div>
                            <h2 id="preview-guild-name" class="text-sm font-bold text-gray-100 flex items-center space-x-1.5">
                                <span>Custom Community Realm</span>
                                <svg class="w-4 h-4 text-cyan-400" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                                </svg>
                            </h2>
                            <p class="text-[11px] text-gray-400">Interactive Infrastructure Blueprint Preview</p>
                        </div>
                    </div>

                    <button onclick="addCategoryPrompt()" class="z-10 px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-semibold text-gray-200 border border-gray-700 transition">
                        + Add Category
                    </button>
                </div>

                <!-- Main Discord Interactive Channel Workspace -->
                <div id="discord-canvas" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gray-950/60">
                    <!-- Dynamic Interactive Categories and Channels rendering area -->
                </div>

            </div>

        </section>

    </main>

    <!-- iOS Native Style Photo Action Sheet Popup Modal (Matching Uploaded Image) -->
    <div id="photo-picker-sheet" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-end sm:items-center justify-center p-4">
        <div class="w-full max-w-sm bg-neutral-200 dark:bg-neutral-800/95 rounded-2xl overflow-hidden shadow-2xl mb-2 sm:mb-0 divide-y divide-neutral-300 dark:divide-neutral-700 border border-neutral-700/50">
            <button type="button" onclick="triggerPicker('library')" class="w-full px-5 py-4 text-left flex items-center justify-between text-base font-normal text-neutral-900 dark:text-neutral-100 active:bg-neutral-300 dark:active:bg-neutral-700 transition">
                <span>Photo Library</span>
                <svg class="w-6 h-6 text-neutral-600 dark:text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </button>
            <button type="button" onclick="triggerPicker('camera')" class="w-full px-5 py-4 text-left flex items-center justify-between text-base font-normal text-neutral-900 dark:text-neutral-100 active:bg-neutral-300 dark:active:bg-neutral-700 transition">
                <span>Take Photo or Video</span>
                <svg class="w-6 h-6 text-neutral-600 dark:text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 00-2-2V9z"/>
                    <circle cx="12" cy="13" r="3"/>
                </svg>
            </button>
            <button type="button" onclick="triggerPicker('file')" class="w-full px-5 py-4 text-left flex items-center justify-between text-base font-normal text-neutral-900 dark:text-neutral-100 active:bg-neutral-300 dark:active:bg-neutral-700 transition">
                <span>Choose File</span>
                <svg class="w-6 h-6 text-neutral-600 dark:text-neutral-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
                </svg>
            </button>
        </div>
        <!-- Native Hidden HTML File Inputs -->
        <input type="file" id="input-library" class="hidden" accept="image/*" />
        <input type="file" id="input-camera" class="hidden" accept="image/*,video/*" capture="environment" />
        <input type="file" id="input-file" class="hidden" />
    </div>

    <!-- Application JavaScript Engine -->
    <script>
        // State Management
        let currentBlueprint = {
            guild_name: "Custom Community Realm",
            guild_icon: "",
            separator: "│",
            roles: [
                { name: "👑 Founder", color: "#8b5cf6", permissions: { admin: true } },
                { name: "🛡️ Overseer", color: "#06b6d4", permissions: { manage: true } },
                { name: "⭐ Member", color: "#10b981", permissions: { send: true, connect: true } }
            ],
            categories: [
                {
                    name: "📌 INFORMATION",
                    channels: [
                        { name: "welcome-rules", type: "text" },
                        { name: "announcements", type: "text" }
                    ]
                },
                {
                    name: "💬 GENERAL LOUNGE",
                    channels: [
                        { name: "general-chat", type: "text" },
                        { name: "creations-and-media", type: "text" },
                        { name: "Public Lounge", type: "voice" }
                    ]
                }
            ]
        };

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            bindInputs();
            renderAll();
        });

        function bindInputs() {
            document.getElementById('guild-name-input').addEventListener('input', (e) => {
                currentBlueprint.guild_name = e.target.value || "Discord Server";
                renderPreviewHeader();
            });

            document.getElementById('separator-input').addEventListener('input', (e) => {
                currentBlueprint.separator = e.target.value;
                renderCanvas();
            });

            document.getElementById('guild-icon-input').addEventListener('input', (e) => {
                currentBlueprint.guild_icon = e.target.value;
                renderPreviewHeader();
            });
        }

        // Action Sheet Photo Trigger Handling
        function openPhotoPickerActionSheet() {
            document.getElementById('photo-picker-sheet').classList.remove('hidden');
        }

        function closePhotoPickerActionSheet() {
            document.getElementById('photo-picker-sheet').classList.add('hidden');
        }

        function triggerPicker(type) {
            closePhotoPickerActionSheet();
            if (type === 'library') document.getElementById('input-library').click();
            if (type === 'camera') document.getElementById('input-camera').click();
            if (type === 'file') document.getElementById('input-file').click();
        }

        document.getElementById('photo-picker-sheet').addEventListener('click', function(e) {
            if (e.target === this) closePhotoPickerActionSheet();
        });

        // AI Generation Call
        async function generateLayoutFromAI() {
            const prompt = document.getElementById('prompt-input').value.trim();
            const theme = document.getElementById('theme-select').value;
            
            const btn = document.getElementById('btn-generate');
            const spinner = document.getElementById('generate-spinner');
            const btnText = document.getElementById('generate-btn-text');

            btn.disabled = true;
            spinner.classList.remove('hidden');
            btnText.innerText = "Architecting Infrastructure...";

            try {
                const response = await fetch('/api/generate-layout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, theme })
                });

                if (response.ok) {
                    const data = await response.json();
                    currentBlueprint = data;
                    
                    document.getElementById('guild-name-input').value = currentBlueprint.guild_name || "Custom Server";
                    document.getElementById('separator-input').value = currentBlueprint.separator || "│";
                    document.getElementById('guild-icon-input').value = currentBlueprint.guild_icon || "";
                    
                    renderAll();
                } else {
                    alert("Failed to reach generation API. Applying generative fallback layout.");
                }
            } catch (err) {
                console.error("API error:", err);
            } finally {
                btn.disabled = false;
                spinner.classList.add('hidden');
                btnText.innerText = "Build Custom Architecture";
            }
        }

        // Render Functions
        function renderAll() {
            renderPreviewHeader();
            renderRoles();
            renderCanvas();
        }

        function renderPreviewHeader() {
            const nameEl = document.getElementById('preview-guild-name');
            const iconBox = document.getElementById('preview-icon-box');

            nameEl.querySelector('span').innerText = currentBlueprint.guild_name;

            if (currentBlueprint.guild_icon) {
                iconBox.innerHTML = `<img src="${currentBlueprint.guild_icon}" class="w-full h-full object-cover">`;
            } else {
                iconBox.innerHTML = (currentBlueprint.guild_name || 'C').charAt(0).toUpperCase();
            }
        }

        function renderRoles() {
            const container = document.getElementById('roles-list-container');
            container.innerHTML = '';

            (currentBlueprint.roles || []).forEach((role, idx) => {
                const roleEl = document.createElement('div');
                roleEl.className = "flex items-center justify-between p-2 rounded-lg bg-gray-950 border border-gray-800 text-xs";
                roleEl.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${role.color || '#06b6d4'}"></span>
                        <span class="font-medium text-gray-200">${role.name}</span>
                    </div>
                    <button onclick="removeRole(${idx})" class="text-gray-500 hover:text-red-400 font-bold px-1">✕</button>
                `;
                container.appendChild(roleEl);
            });
        }

        function renderCanvas() {
            const canvas = document.getElementById('discord-canvas');
            canvas.innerHTML = '';

            const sep = currentBlueprint.separator ? `${currentBlueprint.separator} ` : '';

            (currentBlueprint.categories || []).forEach((cat, cIdx) => {
                const catEl = document.createElement('div');
                catEl.className = "bg-gray-900/60 border border-gray-800/80 rounded-xl p-3 space-y-2";
                
                let channelsHtml = '';
                (cat.channels || []).forEach((ch, chIdx) => {
                    const isVoice = ch.type === 'voice';
                    const icon = isVoice 
                        ? `<svg class="w-4 h-4 text-gray-400 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>`
                        : `<span class="text-gray-500 font-bold mr-1.5 text-sm">#</span>`;
                    
                    const displayName = isVoice ? ch.name : `${sep}${ch.name}`;

                    channelsHtml += `
                        <div class="flex items-center justify-between p-2 rounded-lg bg-gray-950/60 hover:bg-gray-800/50 text-xs text-gray-300 transition group">
                            <div class="flex items-center">
                                ${icon}
                                <span class="font-medium">${displayName}</span>
                            </div>
                            <button onclick="removeChannel(${cIdx}, ${chIdx})" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 text-xs">✕</button>
                        </div>
                    `;
                });

                catEl.innerHTML = `
                    <div class="flex items-center justify-between text-xs font-bold text-gray-400 uppercase tracking-wider px-1">
                        <span>${cat.name}</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="addChannelPrompt(${cIdx})" class="text-cyan-400 hover:text-cyan-300 font-medium text-[11px]">+ Channel</button>
                            <button onclick="removeCategory(${cIdx})" class="text-gray-500 hover:text-red-400">✕</button>
                        </div>
                    </div>
                    <div class="space-y-1">
                        ${channelsHtml}
                    </div>
                `;

                canvas.appendChild(catEl);
            });
        }

        // Editing Helpers
        function addRolePrompt() {
            const name = prompt("Enter Role Name:");
            if (!name) return;
            currentBlueprint.roles.push({ name, color: "#06b6d4", permissions: { send: true, connect: true } });
            renderRoles();
        }

        function removeRole(idx) {
            currentBlueprint.roles.splice(idx, 1);
            renderRoles();
        }

        function addCategoryPrompt() {
            const name = prompt("Enter Category Name:");
            if (!name) return;
            currentBlueprint.categories.push({ name: name.toUpperCase(), channels: [] });
            renderCanvas();
        }

        function removeCategory(cIdx) {
            currentBlueprint.categories.splice(cIdx, 1);
            renderCanvas();
        }

        function addChannelPrompt(cIdx) {
            const name = prompt("Enter Channel Name:");
            if (!name) return;
            const type = confirm("Click OK for Voice Channel, Cancel for Text Channel") ? "voice" : "text";
            currentBlueprint.categories[cIdx].channels.push({ name, type });
            renderCanvas();
        }

        function removeChannel(cIdx, chIdx) {
            currentBlueprint.categories[cIdx].channels.splice(chIdx, 1);
            renderCanvas();
        }

        function resetStudio() {
            if (confirm("Reset layout blueprint?")) {
                location.reload();
            }
        }

        function exportBlueprintJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentBlueprint, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${(currentBlueprint.guild_name || 'orca-blueprint').toLowerCase().replace(/\s+/g, '-')}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
