<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Control Panel | Discord Builder</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { 
      background-color: #030712; 
      color: #f8fafc; 
      font-family: 'Inter', sans-serif; 
      overflow-x: hidden;
    }

    /* Ambient Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.3;
      animation: float 20s ease-in-out infinite alternate;
    }
    .orb-1 {
      top: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: #3b82f6;
    }
    .orb-2 {
      bottom: -10%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: #6366f1;
      animation-delay: -10s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-8%, -10%) scale(1.1); }
    }

    .glass-card { 
      background: rgba(15, 23, 42, 0.75); 
      backdrop-filter: blur(20px); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- Animated Background Orbs -->
  <div class="bg-animation">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <header class="sticky top-0 z-40 w-full glass-card border-b border-white/10 px-4 py-3.5">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-xl">🛠️</span>
        <span class="font-black text-sm md:text-base text-white">Staff Control Panel</span>
      </div>
      <span class="px-2.5 py-1 rounded-full bg-blue-500/20 text-blue-400 text-xs font-bold border border-blue-500/30">
        Admin Portal
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 md:py-10 space-y-6 flex-1 w-full">
    
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-black text-white">Pending Build Requests</h1>
        <p class="text-xs text-slate-400">Download blueprint files submitted by buyers to run with <code class="text-cyan-400 font-mono">/build file:</code> in Discord.</p>
      </div>
      <button onclick="fetchBuildRequests()" class="px-4 py-2 rounded-xl bg-cyan-500 text-slate-950 text-xs font-bold hover:bg-cyan-400 transition-all">
        <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Requests
      </button>
    </div>

    <!-- Requests Table/List Container -->
    <div class="glass-card rounded-3xl overflow-hidden shadow-2xl border border-white/10">
      <div class="p-4 bg-slate-900/80 border-b border-white/10 font-bold text-xs text-slate-300">
        Client Submissions
      </div>

      <div id="requestsContainer" class="p-4 space-y-3">
        <!-- Sample Request Item -->
        <div class="p-4 rounded-2xl bg-slate-950/80 border border-white/5 flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm text-cyan-300">Guild ID: 123456789012345678</span>
              <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold">New</span>
            </div>
            <p class="text-xs text-slate-400">Submitted: Just now</p>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="downloadSampleJson()" class="px-3.5 py-2 rounded-xl bg-blue-500/20 hover:bg-blue-500/30 text-blue-300 text-xs font-bold border border-blue-500/30 transition-all">
              <i class="fa-solid fa-download mr-1"></i> Download .JSON
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer class="border-t border-white/10 py-4 px-4 text-center text-[11px] text-slate-500">
    Staff Control Panel • Orca Bot Integration
  </footer>

  <script>
    function fetchBuildRequests() {
      alert("Refreshed pending build requests.");
    }

    function downloadSampleJson() {
      const data = {
        guild_id: "123456789012345678",
        applied_separator: "│",
        roles: [{ name: "Admin", color: "#06b6d4" }],
        categories: [{ name: "GENERAL", channels: [{ name: "general-chat", emoji: "💬" }] }]
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "server_build.json";
      a.click();
    }
  </script>
</body>
</html>
