<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Echo Dashboard — Discord Infrastructure Builder</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-base: #0b0d12;
            --panel-bg: rgba(18, 21, 30, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(22, 26, 35, 0.8);
            --input-border: rgba(255, 255, 255, 0.12);
            
            --text-title: #ffffff;
            --text-sub: #949ba4;
            --text-muted: #5c626d;
            
            --discord-sidebar: #11131a;
            --discord-hover: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(19, 23, 34, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);

            /* Glassmorphism Dynamic State Colors */
            --glass-idle-bg: rgba(255, 255, 255, 0.03);
            --glass-idle-text: #4e535e;
            --glass-idle-border: rgba(255, 255, 255, 0.05);

            --glass-active-bg: rgba(168, 85, 247, 0.25);
            --glass-active-text: #e9d5ff;
            --glass-active-border: rgba(192, 132, 252, 0.5);
            --glass-active-glow: 0 0 20px rgba(168, 85, 247, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-base);
            color: #ffffff;
            min-height: 100vh;
            padding: 24px 12px;
            display: flex;
            justify-content: center;
        }

        .page-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Glassmorphism Card Container */
        .header-card {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .header-card h1 {
            font-size: 1.8rem;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .header-card p {
            color: var(--text-sub);
            font-size: 0.92rem;
        }

        /* User Profile Bar (Matches Image) */
        .user-badge-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 18px;
        }

        .user-info-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #2b2d31;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .username-text {
            font-weight: 600;
            font-size: 0.95rem;
            color: #ffffff;
        }

        .logout-link {
            color: #f43f5e;
            font-size: 0.88rem;
            text-decoration: none;
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .logout-link:hover {
            opacity: 1;
        }

        /* Custom reCAPTCHA Widget Box (Matches Image 13) */
        .recaptcha-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px 20px;
            margin-top: 14px;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.2s ease;
        }

        .recaptcha-box:hover {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .recaptcha-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .custom-checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #4e535e;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .custom-checkbox.checked {
            background: #10b981;
            border-color: #10b981;
        }

        .custom-checkbox i {
            color: #ffffff;
            font-size: 0.8rem;
            display: none;
        }

        .custom-checkbox.checked i {
            display: block;
        }

        .recaptcha-label {
            font-size: 0.92rem;
            color: #e2e8f0;
        }

        .recaptcha-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: #4e535e;
        }

        .recaptcha-brand i {
            font-size: 1.4rem;
        }

        .recaptcha-brand span {
            font-size: 0.62rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Inputs Grid */
        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .label-heading {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: rgba(192, 132, 252, 0.6);
        }

        /* Quick Separator Selector Options */
        .separator-selector {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .sep-pill {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--input-border);
            border-radius: 6px;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sep-pill:hover, .sep-pill.active {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(192, 132, 252, 0.6);
            color: #ffffff;
        }

        /* Dynamic Glass UI Action Buttons */
        .btn-glass-action {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: not-allowed;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Initial Incomplete State */
            background: var(--glass-idle-bg);
            color: var(--glass-idle-text);
            border: 1px solid var(--glass-idle-border);
            box-shadow: none;
        }

        /* Light Purple Glassmorphism Active State */
        .btn-glass-action.ready {
            cursor: pointer;
            background: var(--glass-active-bg);
            color: var(--glass-active-text);
            border: 1px solid var(--glass-active-border);
            box-shadow: var(--glass-active-glow);
        }

        .btn-glass-action.ready:hover {
            background: rgba(168, 85, 247, 0.35);
            transform: translateY(-1px);
        }

        /* Builder Columns */
        .builder-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .builder-grid {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-box {
            background: var(--discord-sidebar);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            max-height: 800px;
            overflow-y: auto;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 14px;
        }

        .category-block {
            margin-bottom: 16px;
        }

        .category-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-sub);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 6px 4px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-sub);
            font-size: 0.88rem;
            margin-top: 2px;
        }

        .tree-item:hover, .tree-item.active {
            background: var(--discord-hover);
            color: #ffffff;
        }

        .tree-item.active {
            background: rgba(168, 85, 247, 0.2);
            color: #ffffff;
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .editor-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
        }

        .editor-card h3 {
            font-size: 1.05rem;
            margin-bottom: 14px;
        }

        .perm-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }

        .roles-flex {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .role-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--input-border);
            background: rgba(255, 255, 255, 0.03);
            font-size: 0.82rem;
        }

        .role-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .add-btn-inline {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.78rem;
            padding: 6px 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-btn-inline:hover {
            color: #ffffff;
        }

        #status-banner {
            display: none;
            padding: 14px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid #10b981;
            color: #ffffff;
            text-align: center;
            font-weight: 600;
        }

        #discord-canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- HEADER CONTROL PANEL -->
        <div class="header-card">
            <h1>Discord Infrastructure</h1>
            <p>Fill in parameters to initialize AI schema parsing.</p>

            <!-- User Login Bar (Image 13) -->
            <div class="user-badge-bar">
                <div class="user-info-left">
                    <div class="user-avatar">
                        <img src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
                    </div>
                    <span class="username-text" id="display-user">echo_2530</span>
                </div>
                <a class="logout-link">Logout</a>
            </div>

            <!-- Custom reCAPTCHA Widget (Image 13) -->
            <div class="recaptcha-box" id="recaptcha-btn" onclick="toggleCaptcha()">
                <div class="recaptcha-left">
                    <div class="custom-checkbox" id="captcha-check">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <span class="recaptcha-label">I'm not a robot</span>
                </div>
                <div class="recaptcha-brand">
                    <i class="fa-solid fa-arrows-rotate"></i>
                    <span>reCAPTCHA</span>
                </div>
            </div>

            <!-- Inputs & Quick Separators -->
            <div class="inputs-grid">
                <div class="form-group">
                    <label class="label-heading">TARGET SERVER ID *</label>
                    <input type="text" id="target-server-id" class="form-control" value="1554280544605438054" oninput="validateInputs()">
                </div>
                <div class="form-group">
                    <label class="label-heading">SERVER INVITE LINK *</label>
                    <input type="text" id="target-server-link" class="form-control" value="https://discord.gg/6mTr8sr7v" oninput="validateInputs()">
                </div>
                <div class="form-group">
                    <label class="label-heading">SUBMITTED BY USER *</label>
                    <input type="text" id="submitted-by-user" class="form-control" value="@echo_2530" oninput="validateInputs()">
                </div>
                <div class="form-group">
                    <label class="label-heading">SERVER NAME</label>
                    <input type="text" id="target-server-name" class="form-control" value="Echo Studio - Create A Professional Rob Server" oninput="updateServerName()">
                </div>
            </div>

            <!-- Quick Separator Selector -->
            <div class="form-group" style="margin-top:14px;">
                <label class="label-heading">QUICK SEPARATOR</label>
                <div class="separator-selector">
                    <button class="sep-pill active" onclick="setSeparator('│', this)">│ Solid Bar</button>
                    <button class="sep-pill" onclick="setSeparator('•', this)">• Bullet</button>
                    <button class="sep-pill" onclick="setSeparator('—', this)">— Dash</button>
                    <button class="sep-pill" onclick="setSeparator('-', this)">- Hyphen</button>
                    <button class="sep-pill" onclick="setSeparator('|', this)">| Pipe</button>
                </div>
            </div>

            <!-- Verify & Continue Button -->
            <button id="verify-continue-btn" class="btn-glass-action" style="margin-top:18px;">
                Verify & Continue <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div id="status-banner"></div>

        <!-- BUILDER DASHBOARD -->
        <div class="builder-grid">
            
            <!-- LEFT DISCORD TREE -->
            <div class="sidebar-box">
                <div class="sidebar-header">
                    <h2 id="server-title-heading">Echo Studio</h2>
                    <span style="font-size: 0.65rem; color: var(--text-muted); font-weight:700;">LIVE PREVIEW</span>
                </div>
                <div id="sidebar-category-container"></div>
                <button class="add-btn-inline" style="margin-top: 12px; font-weight:700;" onclick="addCategory()">
                    <i class="fa-solid fa-plus"></i> NEW CATEGORY
                </button>
            </div>

            <!-- RIGHT DETAILS EDITORS -->
            <div class="editor-panel">
                
                <!-- CHANNEL SETTINGS -->
                <div class="editor-card">
                    <h3 id="channel-settings-title">Channel settings — #general</h3>
                    <div class="inputs-grid" style="margin-top:0;">
                        <div class="form-group">
                            <label class="label-heading">EMOJI</label>
                            <input type="text" id="edit-chan-emoji" class="form-control" value="💬" oninput="updateActiveChannel()">
                        </div>
                        <div class="form-group">
                            <label class="label-heading">NAME</label>
                            <input type="text" id="edit-chan-name" class="form-control" value="general" oninput="updateActiveChannel()">
                        </div>
                        <div class="form-group">
                            <label class="label-heading">TYPE</label>
                            <select id="edit-chan-type" class="form-control" onchange="updateActiveChannel()">
                                <option value="text">text</option>
                                <option value="voice">voice</option>
                                <option value="announcement">announcement</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" style="margin-top:12px;">
                        <label class="label-heading">TOPIC</label>
                        <input type="text" id="edit-chan-topic" class="form-control" value="General server chat" oninput="updateActiveChannel()">
                    </div>
                </div>

                <!-- PERMISSIONS -->
                <div class="editor-card">
                    <h3>Permissions <span id="perm-chan-badge" style="color:var(--text-muted); font-size:0.85rem;"></span></h3>
                    <div id="permissions-list"></div>
                </div>

                <!-- ROLES -->
                <div class="editor-card">
                    <h3>Roles</h3>
                    <div id="roles-container" class="roles-flex"></div>
                    <button class="add-btn-inline" style="padding:0;" onclick="addNewRole()">+ New role</button>
                </div>

                <!-- SUBMIT TO STAFF BUTTON -->
                <button id="submit-btn" class="btn-glass-action" onclick="handleSubmitToStaff()">
                    <i class="fa-solid fa-paper-plane"></i> Submit to Staff
                </button>

            </div>
        </div>
    </div>

    <!-- Canvas for Image Generation -->
    <canvas id="discord-canvas" width="360" height="600"></canvas>

    <script>
        let isCaptchaVerified = false;
        let selectedSeparator = '│';

        let currentLayout = {
            server_name: "Echo Studio - Create A Professional Rob Server",
            roles: [
                { name: "Owner", color: "#eab308" },
                { name: "Admin", color: "#ef4444" },
                { name: "Moderator", color: "#3b82f6" },
                { name: "Member", color: "#22c55e" }
            ],
            categories: [
                {
                    name: "INFORMATION",
                    emoji: "📢",
                    channels: [
                        { name: "welcome", type: "text", emoji: "👋", topic: "Welcome channel" },
                        { name: "rules", type: "text", emoji: "📜", topic: "Server rules" }
                    ]
                },
                {
                    name: "CHAT ZONES",
                    emoji: "💬",
                    channels: [
                        { name: "general", type: "text", emoji: "💬", topic: "General discussions" },
                        { name: "media", type: "text", emoji: "📷", topic: "Share images" }
                    ]
                }
            ]
        };

        let activeCatIdx = 1;
        let activeChanIdx = 0;

        // Toggle Captcha Check State
        function toggleCaptcha() {
            isCaptchaVerified = !isCaptchaVerified;
            const box = document.getElementById('captcha-check');
            if (isCaptchaVerified) {
                box.classList.add('checked');
            } else {
                box.classList.remove('checked');
            }
            validateInputs();
        }

        // Quick Separator Selector Handler
        function setSeparator(sep, btn) {
            selectedSeparator = sep;
            document.querySelectorAll('.sep-pill').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            renderSidebar();
        }

        // Dynamic Glass UI Input Validation
        function validateInputs() {
            const serverId = document.getElementById('target-server-id').value.trim();
            const serverLink = document.getElementById('target-server-link').value.trim();
            const user = document.getElementById('submitted-by-user').value.trim();

            const isValid = serverId !== '' && serverLink !== '' && user !== '' && isCaptchaVerified;

            const verifyBtn = document.getElementById('verify-continue-btn');
            const submitBtn = document.getElementById('submit-btn');

            if (isValid) {
                verifyBtn.classList.add('ready');
                submitBtn.classList.add('ready');
            } else {
                verifyBtn.classList.remove('ready');
                submitBtn.classList.remove('ready');
            }
        }

        function updateServerName() {
            const val = document.getElementById('target-server-name').value;
            currentLayout.server_name = val;
            document.getElementById('server-title-heading').innerText = val.split('-')[0].trim();
        }

        function renderDashboard() {
            renderSidebar();
            renderActiveChannelDetails();
            renderPermissions();
            renderRoles();
            validateInputs();
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-category-container');
            container.innerHTML = '';

            currentLayout.categories.forEach((cat, cIdx) => {
                const catDiv = document.createElement('div');
                catDiv.className = 'category-block';

                const headerDiv = document.createElement('div');
                headerDiv.className = 'category-title';
                headerDiv.innerHTML = `
                    <span>▾ ${cat.emoji || ''} ${selectedSeparator} ${cat.name}</span>
                    <i class="fa-solid fa-xmark" onclick="deleteCategory(${cIdx})" style="cursor:pointer;"></i>
                `;
                catDiv.appendChild(headerDiv);

                const channelList = document.createElement('div');
                cat.channels.forEach((chan, chIdx) => {
                    const item = document.createElement('div');
                    const isActive = (cIdx === activeCatIdx && chIdx === activeChanIdx);
                    item.className = `tree-item ${isActive ? 'active' : ''}`;
                    item.onclick = () => selectChannel(cIdx, chIdx);

                    let icon = '#';
                    if (chan.type === 'voice') icon = '🔊';
                    if (chan.type === 'announcement') icon = '📣';

                    item.innerHTML = `
                        <div>${icon} ${chan.emoji || ''} ${selectedSeparator} ${chan.name}</div>
                        <i class="fa-solid fa-xmark" onclick="event.stopPropagation(); deleteChannel(${cIdx}, ${chIdx})" style="color:var(--text-muted);"></i>
                    `;
                    channelList.appendChild(item);
                });

                const addChanBtn = document.createElement('button');
                addChanBtn.className = 'add-btn-inline';
                addChanBtn.innerHTML = `<i class="fa-solid fa-plus"></i> new-channel`;
                addChanBtn.onclick = () => addChannel(cIdx);

                catDiv.appendChild(channelList);
                catDiv.appendChild(addChanBtn);
                container.appendChild(catDiv);
            });
        }

        function selectChannel(cIdx, chIdx) {
            activeCatIdx = cIdx;
            activeChanIdx = chIdx;
            renderDashboard();
        }

        function renderActiveChannelDetails() {
            const chan = currentLayout.categories[activeCatIdx]?.channels[activeChanIdx];
            if (!chan) return;

            document.getElementById('channel-settings-title').innerText = `Channel settings — #${chan.name}`;
            document.getElementById('edit-chan-emoji').value = chan.emoji || '';
            document.getElementById('edit-chan-name').value = chan.name;
            document.getElementById('edit-chan-type').value = chan.type || 'text';
            document.getElementById('edit-chan-topic').value = chan.topic || '';
        }

        function updateActiveChannel() {
            const chan = currentLayout.categories[activeCatIdx]?.channels[activeChanIdx];
            if (!chan) return;

            chan.emoji = document.getElementById('edit-chan-emoji').value;
            chan.name = document.getElementById('edit-chan-name').value;
            chan.type = document.getElementById('edit-chan-type').value;
            chan.topic = document.getElementById('edit-chan-topic').value;

            renderSidebar();
        }

        function renderPermissions() {
            const chan = currentLayout.categories[activeCatIdx]?.channels[activeChanIdx];
            if (!chan) return;

            document.getElementById('perm-chan-badge').innerText = `# ${chan.emoji || ''} ${selectedSeparator} ${chan.name}`;
            const list = document.getElementById('permissions-list');
            list.innerHTML = '';

            currentLayout.roles.forEach(r => {
                const row = document.createElement('div');
                row.className = 'perm-row';
                row.innerHTML = `
                    <span style="font-weight:600;">${r.name}</span>
                    <span style="color:#10b981; font-size:0.78rem; font-weight:700;">✓ View  ✓ Send</span>
                `;
                list.appendChild(row);
            });
        }

        function renderRoles() {
            const container = document.getElementById('roles-container');
            container.innerHTML = '';
            currentLayout.roles.forEach(r => {
                const pill = document.createElement('div');
                pill.className = 'role-pill';
                pill.style.borderColor = r.color;
                pill.innerHTML = `<span class="role-dot" style="background:${r.color}"></span><span>${r.name}</span>`;
                container.appendChild(pill);
            });
        }

        function addCategory() {
            currentLayout.categories.push({ name: "NEW CATEGORY", emoji: "📁", channels: [] });
            renderSidebar();
        }

        function addChannel(cIdx) {
            currentLayout.categories[cIdx].channels.push({ name: "new-channel", type: "text", emoji: "💬", topic: "" });
            selectChannel(cIdx, currentLayout.categories[cIdx].channels.length - 1);
        }

        function deleteCategory(cIdx) {
            currentLayout.categories.splice(cIdx, 1);
            activeCatIdx = 0;
            activeChanIdx = 0;
            renderDashboard();
        }

        function deleteChannel(cIdx, chIdx) {
            currentLayout.categories[cIdx].channels.splice(chIdx, 1);
            activeChanIdx = 0;
            renderDashboard();
        }

        function addNewRole() {
            const name = prompt("Role Name:");
            if (name) {
                currentLayout.roles.push({ name, color: "#8b5cf6" });
                renderRoles();
            }
        }

        function generateCanvasImage() {
            const canvas = document.getElementById('discord-canvas');
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = "#11131a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px sans-serif";
            ctx.fillText(currentLayout.server_name.substring(0, 24), 16, 32);

            let y = 60;
            currentLayout.categories.forEach(cat => {
                ctx.fillStyle = "#949ba4";
                ctx.font = "bold 11px sans-serif";
                ctx.fillText(`▾ ${cat.emoji || ''} ${selectedSeparator} ${cat.name.toUpperCase()}`, 16, y);
                y += 22;

                cat.channels.forEach(chan => {
                    ctx.fillStyle = "#2b2d31";
                    ctx.fillRect(16, y - 14, 328, 24);

                    ctx.fillStyle = "#dbdee1";
                    ctx.font = "13px sans-serif";
                    const prefix = chan.type === 'voice' ? '🔊' : '#';
                    ctx.fillText(`${prefix} ${chan.emoji || ''} ${selectedSeparator} ${chan.name}`, 24, y);
                    y += 28;
                });
                y += 10;
            });

            return canvas.toDataURL('image/png');
        }

        async function handleSubmitToStaff() {
            if (!isCaptchaVerified) {
                alert("Please check 'I'm not a robot' before submitting.");
                return;
            }

            const btn = document.getElementById('submit-btn');
            const banner = document.getElementById('status-banner');
            
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Submitting...`;

            const imageBase64 = generateCanvasImage();

            const payload = {
                server_id: document.getElementById('target-server-id').value,
                server_link: document.getElementById('target-server-link').value,
                submitted_by: document.getElementById('submitted-by-user').value,
                server_name: currentLayout.server_name,
                categories: currentLayout.categories,
                roles: currentLayout.roles,
                image_preview: imageBase64
            };

            try {
                const res = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await res.json();
                if (result.success) {
                    banner.style.display = 'block';
                    banner.innerText = `Blueprint dispatched successfully! Command: /build file: ${result.blueprint_url}`;
                } else {
                    alert("Submission error: " + result.error);
                }
            } catch (err) {
                alert("Failed to submit layout to backend.");
            } finally {
                btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Submit to Staff`;
            }
        }

        updateServerName();
        renderDashboard();
    </script>
</body>
</html>
